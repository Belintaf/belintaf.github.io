  --acc:#a07520;--gld:#c9a030;--gld2:#e0b840;
  --red:#6a1a1a;--rdt:#bf5555;
  --sel:#1a3a1a;--selt:#70cf55;--selb:#3a6a30;
  --s-col:#1e3a1a;--s-col-t:#70bf58;--s-col-b:#3a6630;
  --s-pri:#3a3010;--s-pri-t:#c0a030;--s-pri-b:#7a6020;
  --s-fru:#453a00;--s-fru-t:#e0c020;--s-fru-b:#9a8010;
  --s-des:#1a2535;--s-des-t:#5a90c0;--s-des-b:#2a4a6a;
  --s-fin:#181818;--s-fin-t:#505050;--s-fin-b:#303030;
  --s-con:#3a1010;--s-con-t:#c04040;--s-con-b:#7a2020;
  --s-act:#1a2a3a;--s-act-t:#6ab0d0;--s-act-b:#2a5a7a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'VT323',monospace;font-size:calc(20px*var(--fz,1));line-height:1.35;min-height:100%}

:root[data-theme=day]{--bg:#f4efe3;--bg2:#ebe5d6;--bg3:#e1dac8;--bg4:#d8d0bb;--brd:#cfc6b0;--brd2:#bdb399;--brd3:#a89d80;--txt:#2e2a20;--dim:#7a7160;--dim2:#a89f8a;--acc:#8a6410;--gld:#8a6410;--gld2:#6e4f08;--red:#e6c4c0;--rdt:#a02828;--sel:#d4e8c8;--selt:#2c6a1c;--selb:#8ab87a;--s-col:#d4e8c8;--s-col-t:#2c6a1c;--s-col-b:#8ab87a;--s-pri:#efe2b4;--s-pri-t:#7a5a08;--s-pri-b:#c9a840;--s-fru:#f4e49a;--s-fru-t:#6a5400;--s-fru-b:#c4a410;--s-des:#cfe0f0;--s-des-t:#1f5a8c;--s-des-b:#80aad0;--s-fin:#e1dac8;--s-fin-t:#6a6455;--s-fin-b:#bdb399;--s-con:#f0cccc;--s-con-t:#a02828;--s-con-b:#d08888;--s-act:#cde4f0;--s-act-t:#1f6a8c;--s-act-b:#80b4d0}
.cfgf{text-align:center;padding:18px 0 30px}.cfg-link{background:none;border:0;color:var(--dim);font:inherit;font-size:calc(15px*var(--fz,1));letter-spacing:2px;cursor:pointer}.cfg-link:hover{color:var(--gld)}
.cfg-row{margin-bottom:16px}.cfg-row .brow{flex-wrap:wrap;gap:6px}.cfgb.on{border-color:var(--gld);color:var(--gld2)}.cfg-col{display:flex;flex-direction:column;gap:2px;font-size:calc(14px*var(--fz,1));color:var(--dim)}.cfg-col input{width:64px;height:34px;padding:0;background:none;border:1px solid var(--brd2)}.cfg-ver{color:var(--dim);font-size:calc(14px*var(--fz,1));margin-top:8px}
header{background:var(--bg2);border-bottom:2px solid var(--brd2);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:100}
.logo{font-family:'Press Start 2P',monospace;font-size:calc(9px*var(--fz,1));color:var(--gld);letter-spacing:2px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:1px solid var(--brd);color:var(--dim);font-family:'VT323',monospace;font-size:calc(15px*var(--fz,1));padding:5px 9px;cursor:pointer;letter-spacing:1px;white-space:nowrap;flex-shrink:0}
nav button:hover{color:var(--txt);border-color:var(--brd2)}
nav button.active{border-color:var(--acc);color:var(--gld);background:var(--bg3)}

main{max-width:760px;margin:0 auto;padding:14px 16px}
section{display:none}
section.active{display:block}

.sh{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--brd);padding-bottom:6px;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.sh-title{font-family:'Press Start 2P',monospace;font-size:calc(8px*var(--fz,1));color:var(--dim);letter-spacing:2px}
.sh-acts{display:flex;gap:4px;align-items:center}
.sh-meta{font-size:calc(16px*var(--fz,1));color:var(--dim)}

/* SEARCH */
.search-bar{display:flex;gap:6px;margin-bottom:10px}
.search-bar input{flex:1}

/* FILTERS */
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fb{background:var(--bg2);border:1px solid var(--brd);color:var(--dim);font-family:'VT323',monospace;font-size:calc(15px*var(--fz,1));padding:1px 8px;cursor:pointer}
.fb:hover{color:var(--txt)}.fb.on{border-color:var(--acc);color:var(--gld)}
.fsep{color:var(--brd);padding:0 2px;font-size:calc(16px*var(--fz,1));align-self:center}

/* CARDS */
.grid{display:flex;flex-direction:column;gap:4px}
.pcard{background:var(--bg2);border:1px solid var(--brd);padding:9px 12px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:start}
.pcard:hover{border-color:var(--brd2);background:var(--bg3)}
.pcard-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pcode{font-family:'Press Start 2P',monospace;font-size:calc(8px*var(--fz,1));color:var(--gld);letter-spacing:1px;white-space:nowrap}
.pstrain{font-size:calc(20px*var(--fz,1));color:var(--txt)}
.pmeta{font-size:calc(15px*var(--fz,1));color:var(--dim)}
.pright{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;align-self:stretch;gap:4px}
.psus{font-size:calc(14px*var(--fz,1));color:var(--gld);padding:1px 5px;border:1px solid var(--gld);white-space:nowrap}
.pdays{font-size:calc(14px*var(--fz,1));color:var(--dim);padding:1px 5px;border:1px solid var(--brd);white-space:nowrap}
.sel-star{color:var(--selt);font-size:calc(16px*var(--fz,1));line-height:1}

.badge{font-size:calc(13px*var(--fz,1));padding:2px 7px;border:1px solid;white-space:nowrap;font-family:'VT323',monospace;letter-spacing:1px}
.s-COLONIZANDO,[data-s=COLONIZANDO],.s-FRESCO,[data-s=FRESCO]{--sb:var(--s-col);--sbb:var(--s-col-b);--st:var(--s-col-t)}
.s-PRIMORDIANDO,[data-s=PRIMORDIANDO],.s-DEGRADADO,[data-s=DEGRADADO]{--sb:var(--s-pri);--sbb:var(--s-pri-b);--st:var(--s-pri-t)}
.s-FRUCTIFICANDO,[data-s=FRUCTIFICANDO]{--sb:var(--s-fru);--sbb:var(--s-fru-b);--st:var(--s-fru-t)}
.s-DESCANSANDO,[data-s=DESCANSANDO],.s-VIABLE,[data-s=VIABLE]{--sb:var(--s-des);--sbb:var(--s-des-b);--st:var(--s-des-t)}
.s-COLONIZADO,[data-s=COLONIZADO]{--sb:var(--s-act);--sbb:var(--s-act-b);--st:var(--s-act-t)}
.s-FINALIZADO,[data-s=FINALIZADO],.s-DESCARTADO,[data-s=DESCARTADO]{--sb:var(--s-fin);--sbb:var(--s-fin-b);--st:var(--s-fin-t)}
.s-CONTAMINADO,[data-s=CONTAMINADO]{--sb:var(--s-con);--sbb:var(--s-con-b);--st:var(--s-con-t)}
.s-ACTIVO,[data-s=ACTIVO]{--sb:var(--s-act);--sbb:var(--s-act-b);--st:var(--s-act-t)}
.badge,.sbtn.cur{background:var(--sb);border-color:var(--sbb);color:var(--st)}

/* DETAIL */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:calc(17px*var(--fz,1));cursor:pointer;background:none;border:none;font-family:'VT323',monospace;padding:0;margin-bottom:14px;letter-spacing:1px}
.back:hover{color:var(--acc)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:12px}
.dcode{font-family:'Press Start 2P',monospace;font-size:calc(11px*var(--fz,1));color:var(--gld);margin-bottom:4px;letter-spacing:2px}
.dstrain{font-size:calc(26px*var(--fz,1));color:var(--txt);margin-bottom:2px}.dsub{font-size:calc(16px*var(--fz,1));color:var(--dim)}
.info-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:12px}
.ibox{background:var(--bg2);border:1px solid var(--brd);padding:7px 10px}
.ilabel{font-size:calc(12px*var(--fz,1));color:var(--dim);margin-bottom:1px;letter-spacing:1px}
.ivalue{font-size:calc(19px*var(--fz,1));color:var(--txt)}

/* LINEAGE */
.lineage{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:12px;padding:8px 10px;background:var(--bg3);border:1px solid var(--brd)}
.lin-item{font-family:'Press Start 2P',monospace;font-size:calc(7px*var(--fz,1));color:var(--dim);cursor:pointer;padding:3px 6px;border:1px solid var(--brd)}
.lin-item:hover{color:var(--gld);border-color:var(--acc)}
.lin-item.current{color:var(--gld);border-color:var(--acc)}
.lin-arrow{color:var(--dim);font-size:calc(14px*var(--fz,1))}

/* SELECTION */
.sel-box{background:var(--bg3);border:1px solid var(--brd);padding:8px 10px;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px}
.sel-box.active{background:var(--sel);border-color:var(--selb)}
.sel-toggle{background:none;border:1px solid var(--brd2);color:var(--dim);font-family:'VT323',monospace;font-size:calc(15px*var(--fz,1));padding:3px 8px;cursor:pointer;white-space:nowrap;letter-spacing:1px}
.sel-toggle:hover{border-color:var(--acc);color:var(--gld)}
.sel-box.active .sel-toggle{border-color:var(--selb);color:var(--selt)}
.sel-crit{flex:1;font-size:calc(17px*var(--fz,1));color:var(--txt);background:none;border:none;outline:none;font-family:'VT323',monospace}
.sel-crit::placeholder{color:var(--dim)}

/* STATUS */
.status-row{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:12px}
.sbtn{font-family:'VT323',monospace;font-size:calc(15px*var(--fz,1));padding:3px 9px;cursor:pointer;border:1px solid var(--brd);background:var(--bg2);color:var(--dim);letter-spacing:1px}
.sbtn:hover{color:var(--txt);border-color:var(--brd2)}

/* NOTES */
.notebox{background:var(--bg2);border:1px solid var(--brd);padding:8px 10px;margin-bottom:12px}
.notebox-label{font-size:calc(12px*var(--fz,1));color:var(--dim);margin-bottom:4px;letter-spacing:1px}
textarea{width:100%;background:none;border:none;color:var(--txt);font-family:'VT323',monospace;font-size:calc(19px*var(--fz,1));resize:vertical;min-height:60px;outline:none;line-height:1.35}

/* PHOTOS */
.photo-section{margin-bottom:12px}
.subsec-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--brd);padding-bottom:5px;margin-bottom:8px}
.subsec-title{font-family:'Press Start 2P',monospace;font-size:calc(7px*var(--fz,1));color:var(--dim);letter-spacing:2px}
.photo-grid{display:flex;flex-wrap:wrap;gap:6px}
.photo-thumb{position:relative;width:90px;height:90px;cursor:pointer;flex-shrink:0;border:1px solid var(--brd)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb:hover .photo-del{opacity:1}
.photo-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.85);border:none;color:var(--rdt);font-size:calc(14px*var(--fz,1));cursor:pointer;width:18px;height:18px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .1s;padding:0;line-height:1}
.photo-add{width:90px;height:90px;border:1px dashed var(--brd2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--dim);font-size:calc(28px*var(--fz,1));flex-shrink:0}
.photo-add:hover{border-color:var(--acc);color:var(--gld)}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:999;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;object-fit:contain}
.lb-close{position:fixed;top:16px;right:16px;background:none;border:1px solid var(--brd2);color:var(--txt);font-family:'VT323',monospace;font-size:calc(20px*var(--fz,1));padding:4px 12px;cursor:pointer;z-index:1000}
.lb-close:hover{border-color:var(--rdt);color:var(--rdt)}

/* FLUSHES */
.flush-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.fitem{background:var(--bg2);border:1px solid var(--brd);overflow:hidden}
.fitem-head{padding:7px 10px;display:grid;grid-template-columns:28px 1fr auto auto;gap:0 10px;align-items:center;cursor:pointer}
.fitem-head:hover{background:var(--bg3)}
.fnum{font-family:'Press Start 2P',monospace;font-size:calc(7px*var(--fz,1));color:var(--acc)}
.fyield{font-size:calc(20px*var(--fz,1));color:var(--txt)}
.fdate{font-size:calc(15px*var(--fz,1));color:var(--dim)}
.fexp{font-size:calc(16px*var(--fz,1));color:var(--dim);transition:transform .15s}
.fexp.open{transform:rotate(180deg)}
.fitem-body{display:none;padding:8px 10px;border-top:1px solid var(--brd);background:var(--bg3)}
.fitem-body.open{display:block}
.fitem-body textarea{min-height:50px;font-size:calc(17px*var(--fz,1))}
.fdel{background:none;border:none;color:var(--dim);font-size:calc(17px*var(--fz,1));cursor:pointer;padding:0;line-height:1}
.fdel:hover{color:var(--rdt)}

/* ADD FLUSH */
.add-flush{background:var(--bg3);border:1px dashed var(--brd2);padding:10px;display:none;flex-direction:column;gap:8px}
.add-flush.open{display:flex}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg{display:flex;flex-direction:column;gap:3px}
.fl{font-size:calc(12px*var(--fz,1));color:var(--dim);letter-spacing:1px}

/* SUMMARY */
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.sum-box{background:var(--bg2);border:1px solid var(--brd);padding:10px 12px;text-align:center}
.sum-val{font-family:'Press Start 2P',monospace;font-size:calc(14px*var(--fz,1));color:var(--gld);margin-bottom:4px}
.sum-label{font-size:calc(15px*var(--fz,1));color:var(--dim)}
.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:16px}
.sum-stat{background:var(--bg2);border:1px solid var(--brd);padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.sum-stat-label{font-size:calc(17px*var(--fz,1));color:var(--dim)}
.sum-stat-val{font-size:calc(22px*var(--fz,1));color:var(--txt)}
.recent-item{background:var(--bg2);border:1px solid var(--brd);padding:8px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:0 12px;align-items:center;cursor:pointer;margin-bottom:4px}
.recent-item:hover{border-color:var(--brd2)}

/* SPORES */
.prcard{background:var(--bg2);border:1px solid var(--brd);padding:9px 12px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:start}
.prcard:hover{border-color:var(--brd2);background:var(--bg3)}

/* INPUTS */
input,select{background:var(--bg2);border:1px solid var(--brd);color:var(--txt);font-family:'VT323',monospace;font-size:calc(19px*var(--fz,1));padding:4px 8px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
select option{background:var(--bg2)}

/* BUTTONS */
.btn{background:var(--bg2);border:1px solid var(--brd2);color:var(--dim);font-family:'VT323',monospace;font-size:calc(18px*var(--fz,1));padding:4px 12px;cursor:pointer;letter-spacing:1px}
.btn:hover{color:var(--txt);border-color:var(--txt)}
.btn-a{border-color:var(--acc);color:var(--gld)}.btn-a:hover{background:var(--acc);color:var(--bg)}
.btn-x{border-color:var(--red);color:var(--rdt)}.btn-x:hover{background:var(--red);color:var(--txt)}
.btn-sm{font-size:calc(14px*var(--fz,1));padding:2px 8px}
.del-confirm{display:flex;align-items:center;gap:6px}
.del-confirm span{font-size:calc(16px*var(--fz,1));color:var(--rdt);letter-spacing:1px}

/* FORMS */
.form-box{background:var(--bg2);border:1px solid var(--brd);padding:16px;display:flex;flex-direction:column;gap:12px}
.code-preview{font-family:'Press Start 2P',monospace;font-size:calc(13px*var(--fz,1));color:var(--gld);padding:12px;background:var(--bg3);border:1px solid var(--brd2);text-align:center;letter-spacing:4px}

/* STRAINS */
.cepa-list{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.citem{background:var(--bg2);border:1px solid var(--brd);padding:9px 12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 10px}
.ccode{font-family:'Press Start 2P',monospace;font-size:calc(8px*var(--fz,1));color:var(--gld);margin-bottom:3px}
.cname{font-size:calc(20px*var(--fz,1));color:var(--txt)}.ccnt{font-size:calc(15px*var(--fz,1));color:var(--dim)}
.cright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.citem.edit{gap:8px;flex-wrap:nowrap}
.citem.edit .cright{flex-wrap:wrap}
.drag-h{background:none;border:1px solid var(--brd2);color:var(--dim);width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex-shrink:0}
.drag-h::before{content:'';width:10px;height:15px;background:radial-gradient(circle,currentColor 1.4px,transparent 1.8px) 0 0/5px 5px}
.drag-h:hover,.drag-h:focus-visible{color:var(--gld);border-color:var(--gld);outline:none}
.citem.dragging{position:relative;z-index:20;border-color:var(--gld);background:var(--bg3);box-shadow:0 8px 18px rgba(0,0,0,.7)}
.citem.dragging .drag-h{cursor:grabbing;color:var(--gld)}
body.no-select{user-select:none;-webkit-user-select:none}
.cname-in{font-size:calc(18px*var(--fz,1));padding:2px 6px}
.brow{display:flex;gap:6px}
.add-row[hidden],.fg[hidden]{display:none}
.cgroup{display:flex;align-items:center;gap:6px;margin-top:10px;padding:4px 2px 3px;border-bottom:1px solid var(--brd2);color:var(--gld);font-size:calc(17px*var(--fz,1));letter-spacing:1px}
.cgroup:first-child{margin-top:0}
.cg-name{flex:1}
.cg-n{color:var(--dim);font-size:calc(15px*var(--fz,1));margin-left:auto}
.cg-in{flex:1;min-width:0;font-size:calc(18px*var(--fz,1));padding:2px 6px}
.photo-thumb img.missing{opacity:.25}
[role=button]:focus-visible{outline:1px solid var(--gld);outline-offset:1px}
.sug-wrap{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:60;background:var(--bg2);border:1px solid var(--gld);border-top:none;max-height:min(220px,35vh);overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 8px 16px rgba(0,0,0,.7)}
.sug[hidden]{display:none}
.sug-item{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 10px;border-bottom:1px solid var(--brd);cursor:pointer}
.sug-item:last-child{border-bottom:none}
.sug-item.on,.sug-item:hover{background:var(--bg3)}
.sug-code{color:var(--gld);font-size:calc(19px*var(--fz,1));white-space:nowrap}
.sug-lab{color:var(--dim);font-size:calc(15px*var(--fz,1));text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.src-warn{font-size:calc(14px*var(--fz,1));color:var(--gld);margin-top:3px}.src-warn:empty{display:none}
.add-row{background:var(--bg3);border:1px dashed var(--brd2);padding:10px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}

/* NEW CHOICE */
.nuevo-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.choice-btn{background:var(--bg2);border:1px solid var(--brd2);padding:20px;text-align:center;cursor:pointer;font-family:'VT323',monospace}
.choice-btn:hover{border-color:var(--acc);background:var(--bg3)}
.choice-btn .choice-icon{font-family:'Press Start 2P',monospace;font-size:calc(10px*var(--fz,1));color:var(--gld);margin-bottom:8px}
.choice-btn .choice-sub{font-size:calc(16px*var(--fz,1));color:var(--dim)}
.choice-btn.selected{border-color:var(--acc);background:var(--bg3)}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:998;align-items:center;justify-content:center}
.overlay.open{display:flex}

.overlay-body{font-size:calc(18px*var(--fz,1));color:var(--txt);margin-bottom:8px}
.overlay-warn{font-size:calc(16px*var(--fz,1));color:var(--rdt);margin-bottom:20px}

.hdate-fixed{font-size:calc(17px*var(--fz,1));color:var(--dim)}
input.hdate{width:auto;font-size:calc(17px*var(--fz,1));padding:1px 6px;color:var(--dim)}
.hdur{margin-left:auto;font-size:calc(18px*var(--fz,1));color:var(--txt)}
.hx{width:10px}
.qty-note{font-size:calc(17px*var(--fz,1));color:var(--gld);margin-top:-4px}
.hnote{font-size:calc(15px*var(--fz,1));color:var(--dim);margin-bottom:6px}
.empty{border:1px dashed var(--brd);padding:32px 20px;text-align:center;color:var(--dim);font-size:calc(18px*var(--fz,1))}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:calc(10px*var(--fz,1));color:var(--gld);letter-spacing:3px;z-index:9999}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--brd2)}

}

<footer class="cfgf"><button class="cfg-link" onclick="openConfig()">[ CONFIG ]</button></footer>
<script>
/* ═══════════════════════════════════════════════════════════════════════════════
   MycoLab — single-file mushroom cultivation tracker (no server, no external requests)

   DATA MODEL (internal names are kept for compatibility with saved data and exported JSON)
     state.cepas     strains        {code, name, group}    (array order = display order, sorted by group)
     state.groups    strain categories in display order ("Cubes", "Exotics"…); cepa.group '' = ungrouped
     state.pasteles  cultures       {id, code, strain, substrate P|B|BP|A|LC, gen, dateIn, parent, fromPrint, status,
                                     notes, flushes[], photos[], history[], selected, selCriteria}
     state.prints    spore records  {id, code, type PR|SW, strain, gen, originCode, date, storage, status, notes, photos[]}
     parent = source culture code · fromPrint = source spore-record code · dateIn = inoculation date
     photos[] = [{id,date}]: the picture lives in IndexedDB under 'photo:<id>' (schema ≥ 3);
                legacy/imported [{data,date}] (inline data URL) is moved there on load/import.
   STATUS values are stored in Spanish and shown through STATUS_LABEL: COLONIZANDO colonizing · PRIMORDIANDO consolidation ·
     FRUCTIFICANDO fruiting · DESCANSANDO resting · FINALIZADO finished · CONTAMINADO contaminated · ACTIVO active ·
     DESCARTADO discarded · FRESCO fresh · VIABLE · DEGRADADO degraded
   STORAGE: IndexedDB 'mycolab' / store 'kv': 'data' = state · 'photo:<id>' = JPEG data URL.   EXPORT: one JSON, photos inlined.
   ═══════════════════════════════════════════════════════════════════════════════ */
const $=id=>document.getElementById(id);

// ── INDEXEDDB ──
let _db;
// No version is requested: an existing database is opened as it is; if it lacks our store ('kv') the version is bumped once to add it.
const openIDB=()=>_db||(_db=new Promise((res,rej)=>{
  const open=v=>{
    const r=v?indexedDB.open('mycolab',v):indexedDB.open('mycolab');
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv');};
    r.onerror=()=>{_db=null;rej(r.error);};
    r.onsuccess=()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains('kv')){db.close();return open(db.version+1);}
      db.onversionchange=db.onclose=()=>{db.close();_db=null;};
      res(db);
    };
  };
  open();
}));
// The browser may close the connection behind our back (page resumed from background…): reconnect and retry once. Quota errors are not retried.
const IDB_RETRY=['InvalidStateError','TransactionInactiveError','UnknownError'];
const idbReq=(mode,fn)=>{
  const run=()=>openIDB().then(db=>new Promise((res,rej)=>{
    let t,r;
    try{t=db.transaction('kv',mode);r=fn(t.objectStore('kv'));}catch(e){return rej(e);}
    t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>rej(t.error||new Error('Transaction aborted'));
  }));
  return run().catch(e=>{if(IDB_RETRY.includes(e&&e.name)){_db=null;return run();}throw e;});
};
const idbGet=k=>idbReq('readonly',o=>o.get(k)),idbSet=(k,v)=>idbReq('readwrite',o=>o.put(v,k)),idbDel=k=>idbReq('readwrite',o=>o.delete(k));

// ── PHOTOS: kept apart from the state, so saving a note never rewrites every picture ──
const photoCache=new Map(); // small LRU of recently shown photos (data URLs)
const remember=(id,v)=>{photoCache.delete(id);photoCache.set(id,v);if(photoCache.size>40)photoCache.delete(photoCache.keys().next().value);};
async function photoGet(id){
  if(photoCache.has(id)){const v=photoCache.get(id);remember(id,v);return v;}
  const v=await idbGet('photo:'+id);if(v)remember(id,v);return v||null;
}
const photoPut=async(id,data)=>{await idbSet('photo:'+id,data);remember(id,data);};
const photoDrop=id=>{photoCache.delete(id);return idbDel('photo:'+id).catch(e=>console.error('photo delete',e));};
const newPhotoId=()=>'ph'+uid();
const recs=st=>[...st.pasteles,...st.prints];   // every record that carries photos
const photoIds=st=>recs(st).flatMap(p=>(p.photos||[]).map(x=>x.id).filter(Boolean));
const dropPhotos=rec=>rec&&(rec.photos||[]).forEach(ph=>ph.id&&photoDrop(ph.id));
// Moves inline photos ({data,date}) into the store → {id,date}. All-or-nothing: if any write fails, everything done so far is undone
// (inline photos restored, written records deleted), so a failure can neither lose a photo nor leave duplicates. Legacy ids are
// deterministic (retry-safe); imports use fresh ids so an undo can never touch a record the previous data still references.
async function adoptPhotos(st,{fresh=false}={}){
  const done=[],written=[];
  try{
    for(const p of recs(st)){
      const todo=[];
      (p.photos||[]).forEach((ph,i)=>{if(ph&&typeof ph.data==='string'&&ph.data)todo.push([i,fresh?newPhotoId():(ph.id||'m'+p.id+'-'+i),ph]);});
      if(!todo.length)continue;
      await idbReq('readwrite',o=>{for(const [,id,ph] of todo)o.put(ph.data,'photo:'+id);});
      for(const [i,id,ph] of todo){done.push([p,i,ph]);written.push('photo:'+id);p.photos[i]={id,date:ph.date||''};photoCache.delete(id);}
    }
    return {moved:done.length};
  }catch(e){
    done.forEach(([p,i,ph])=>{p.photos[i]=ph;});
    await Promise.all(written.map(k=>idbDel(k).catch(()=>{})));
    return {moved:0,error:e};
  }
}
const MIGR='mycolab_photo_migration_retry_after',ls=fn=>{try{return fn(localStorage);}catch(_){}};
const migrationPaused=()=>Date.now()<+ls(s=>s.getItem(MIGR));
const photoImg=ph=>ph.data?`<img src="${esc(ph.data)}" alt="">`:`<img data-photo="${esc(ph.id)}" alt="">`;
function hydratePhotos(root){ // fills <img data-photo> from the store (instantly if cached)
  root.querySelectorAll('img[data-photo]').forEach(img=>{
    const id=img.dataset.photo,miss=()=>img.classList.add('missing');
    if(photoCache.has(id))img.src=photoCache.get(id);
    else photoGet(id).then(src=>{if(!src)miss();else if(img.isConnected)img.src=src;}).catch(miss);
  });
}

// ── STATE ──
const APP_VERSION='6.9.1',SCHEMA=3; // SCHEMA: 1 = ≤6.5 · 2 = 6.5.1 (spore type, LC) · 3 = 6.6 (photos in a separate store)
let state={schemaVersion:SCHEMA,pasteles:[],cepas:[],groups:[],prints:[]};
let filters={cepa:'ALL',sus:'ALL',status:'ALL',prCepa:'ALL',prType:'ALL'};
let cepaEdit=false;                      // Strains tab edit mode
let currentId=null,currentPrId=null,expandedFlush=null,editMode=null;
let pendingPhoto=null;                   // {k: 'c' culture · 's' spore record, id}
let confirmingDel=null,pendingImport=null; // confirmingDel = k+id of the record awaiting delete confirmation

const STATUSES_PF=['COLONIZANDO','PRIMORDIANDO','FRUCTIFICANDO','DESCANSANDO','FINALIZADO','CONTAMINADO'];
const STATUSES_AG=['ACTIVO','CONTAMINADO','DESCARTADO'],STATUSES_G=['COLONIZANDO','COLONIZADO','FINALIZADO','CONTAMINADO']; // G = grain: no flushes, own lifecycle
const STATUSES_PR=['FRESCO','VIABLE','DEGRADADO','DESCARTADO'];
const ENDED=['FINALIZADO','CONTAMINADO','DESCARTADO'];   // terminal statuses
const NOFLUSH=['A','LC','G'];                                // types without flushes (Agar, LC) use STATUSES_AG
const SUBSTRATES=[{v:'P',l:'P — PF-TEK'},{v:'B',l:'B — BULK'},{v:'BP',l:'BP — BRF PUCK'},{v:'A',l:'A — AGAR'},{v:'LC',l:'LC — LIQUID CULTURE'},{v:'G',l:'G — GRAIN'}];
const SUS_SHORT={P:'P',B:'B',BP:'BP',A:'A',LC:'LC',G:'G'},SUS_NAME={P:'PF-Tek',B:'Bulk',BP:'BRF Puck',A:'Agar',LC:'Liquid culture',G:'Grain'};
const SPORE_TYPES=[{v:'PR',l:'PR — PRINT'},{v:'SW',l:'SW — SWAB'}],SPORE_NAME={PR:'Print',SW:'Swab'};
const STATUS_LABEL={COLONIZANDO:'COLONIZING',COLONIZADO:'COLONIZED',PRIMORDIANDO:'CONSOLIDATION',FRUCTIFICANDO:'FRUITING',DESCANSANDO:'RESTING',FINALIZADO:'FINISHED',CONTAMINADO:'CONTAMINATED',ACTIVO:'ACTIVE',DESCARTADO:'DISCARDED',FRESCO:'FRESH',VIABLE:'VIABLE',DEGRADADO:'DEGRADED'};
const DEFAULT_STRAINS=[{code:'MR',name:'Matias Romero'},{code:'TPB',name:'Thai Pink Buffalo'},{code:'GT',name:'Golden Teacher'},{code:'AB',name:'Alacabenzi'},
  {code:'CB',name:'Charlie Brown'},{code:'FPF',name:'FP+ F8'},{code:'APE',name:'APE'},{code:'YT',name:'Yeti'}];

async function load(){
  try{
    const s=await idbGet('data');
    if(s&&s.pasteles&&s.cepas){
      const legacy=(s.schemaVersion||1)<3;
      state=normalize(s);
      if(!migrationPaused()){
        const r=await adoptPhotos(state);   // schema ≤ 2: pictures leave the state and go to the photo store
        if(r.error)ls(s=>s.setItem(MIGR,Date.now()+864e5));   // nothing was lost; retried tomorrow
        else{ls(s=>s.removeItem(MIGR));if(r.moved||legacy)await save();}
      }
    }else{
      if(s)await idbSet('data-unrecognised-'+Date.now(),s); // never overwrite data we do not understand
      state.cepas=DEFAULT_STRAINS.map(c=>({...c}));await idbSet('data',state);
    }
  }catch(e){console.error(e);}
}
let _saving=null,_dirty=false;
function save(){
  _dirty=true;
  return _saving||(_saving=(async()=>{
    try{while(_dirty){_dirty=false;await idbSet('data',state);}}
    catch(e){console.error('Save:',e);}
    finally{_saving=null;}
  })());
}
const getP=id=>state.pasteles.find(p=>p.id===id),getPr=id=>state.prints.find(p=>p.id===id);
const owner=k=>k==='s'?{get:getPr,render:renderPrDetail}:{get:getP,render:renderDetail};   // k: 'c' culture · 's' spore record

// ── NAVIGATION ──
let curSec='resumen',prevSec='resumen';const listY={cultivos:0,prints:0};
const rememberList=()=>{if(curSec in listY)listY[curSec]=window.scrollY||0;};
const fixScroll=sec=>{if(prevSec===sec)return;const back=(prevSec==='detalle'&&sec==='cultivos')||(prevSec==='pdetalle'&&sec==='prints');window.scrollTo(0,back?listY[sec]:0);};
function showSec(sec){prevSec=curSec;curSec=sec;
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id==='sec-'+sec));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+sec));
}
function go(sec){
  confirmingDel=null;cepaEdit=false;sugClose();
  showSec(sec);
  $('nav-'+sec)?.scrollIntoView?.({block:'nearest',inline:'nearest'});
  ({resumen:renderResumen,cultivos:renderList,prints:renderPrints,cepas:renderCepas,nuevo:initNuevo,
    detalle:()=>currentId&&renderDetail(currentId),pdetalle:()=>currentPrId&&renderPrDetail(currentPrId),config:renderConfig})[sec]?.();
  fixScroll(sec);
}

// ── UTILS ──
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const js=v=>esc(JSON.stringify(v));
const sl=s=>STATUS_LABEL[s]||s;            // display label only; the stored value is unchanged
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const pad=(n,d=3)=>String(n).padStart(d,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const daysSince=d=>{if(!d)return null;const n=dayDiff(d,today());return n>=0?n:null;};
const clampInt=(v,min,max,d)=>{const n=parseInt(v,10);return Number.isNaN(n)?d:Math.min(max,Math.max(min,n));};
const toQty=v=>clampInt(v,1,50,1),toGen=(v,d=1)=>clampInt(v,0,99,d);   // 1–50 cultures per batch · generation may be 0
const noFlush=p=>!!p&&NOFLUSH.includes(p.substrate);
// ── CONFIG (device-local, not part of the data export) ──
const CFG_KEY='mycolab-cfg',COL0={bg:'#080808',txt:'#c8bfa8',acc:'#c9a030'};
const cfgParse=c=>{c=c&&typeof c==='object'?c:{};
  const col=k=>/^#[0-9a-f]{6}$/i.test((c.colors||{})[k])?c.colors[k]:COL0[k];
  return {theme:['night','day','custom'].includes(c.theme)?c.theme:'night',fz:[.92,1,1.12].includes(c.fz)?c.fz:1,badges:c.badges!==false,
    off:(Array.isArray(c.off)?c.off:[]).filter(v=>SUBSTRATES.some(s=>s.v===v)).slice(0,SUBSTRATES.length-1),colors:{bg:col('bg'),txt:col('txt'),acc:col('acc')}};};
const cfgLoad=()=>{try{return cfgParse(JSON.parse(localStorage.getItem(CFG_KEY)));}catch(e){return cfgParse(null);}};
let cfg=cfgLoad(),cfgFrom='resumen';
const cfgSave=()=>{try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));}catch(e){}};
const hexv=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16)),mix=(a,b,t)=>'#'+hexv(a).map((v,i)=>Math.round(v+(hexv(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
const CFG_VARS=['--bg','--bg2','--bg3','--bg4','--brd','--brd2','--brd3','--txt','--dim','--dim2','--gld','--gld2','--acc'];
function applyCfg(){
  const r=document.documentElement,S=r.style,{bg,txt,acc}=cfg.colors,m=t=>mix(bg,txt,t);
  r.dataset.theme=cfg.theme==='day'?'day':'night';CFG_VARS.forEach(k=>S.removeProperty(k));
  if(cfg.theme==='custom')Object.entries({'--bg':bg,'--bg2':m(.04),'--bg3':m(.08),'--bg4':m(.11),'--brd':m(.13),'--brd2':m(.2),'--brd3':m(.28),'--txt':txt,'--dim':m(.45),'--dim2':m(.25),'--gld':acc,'--gld2':mix(acc,txt,.3),'--acc':mix(acc,bg,.3)}).forEach(([k,v])=>S.setProperty(k,v));
  S.setProperty('--fz',cfg.fz);
}
applyCfg();
const subsOn=cur=>SUBSTRATES.filter(x=>!cfg.off.includes(x.v)||x.v===cur); // disabled types are hidden from the pickers, never from existing records
function setCfg(k,v){cfg[k]=v;cfgSave();applyCfg();renderConfig();}
function setColor(k,v){cfg.colors[k]=v;cfgSave();applyCfg();}
function resetColors(){cfg.colors={...COL0};cfgSave();applyCfg();renderConfig();}
function toggleSub(v){const i=cfg.off.indexOf(v);if(i>=0)cfg.off.splice(i,1);else if(cfg.off.length<SUBSTRATES.length-1)cfg.off.push(v);cfgSave();renderConfig();}
function openConfig(){if(curSec!=='config')cfgFrom=curSec;go('config');}
function renderConfig(){
  const b=(on,fn,l)=>`<button class="btn cfgb${on?' on':''}" onclick="${fn}">${l}</button>`,row=(t,c)=>`<div class="cfg-row"><div class="fl">${t}</div><div class="brow">${c}</div></div>`;

  $('config-content').innerHTML=row('THEME',['night','day','custom'].map(t=>b(cfg.theme===t,`setCfg('theme','${t}')`,t.toUpperCase())).join(''))
    +(cfg.theme==='custom'?row('COLORS',col('bg','BACKGROUND')+col('txt','TEXT')+col('acc','ACCENT')+'<button class="btn" onclick="resetColors()">RESET</button>'):'')
    +row('TEXT SIZE',[['SMALL',.92],['NORMAL',1],['LARGE',1.12]].map(([l,v])=>b(cfg.fz===v,`setCfg('fz',${v})`,l)).join(''))
    +row('CULTURE TYPES (a hidden type stays visible in existing records)',SUBSTRATES.map(x=>b(!cfg.off.includes(x.v),`toggleSub('${x.v}')`,x.l)).join(''))
    +row('TYPE BADGE ON CARDS',b(cfg.badges,"setCfg('badges',true)",'SHOW')+b(!cfg.badges,"setCfg('badges',false)",'HIDE'))
    +'<div class="cfg-ver">Settings are saved in the JSON export (EXP) and restored on import (IMP).<br>MYCOLAB v'+APP_VERSION+'</div>';
}
const initialStatus=sus=>sus==='G'||!NOFLUSH.includes(sus)?'COLONIZANDO':'ACTIVO';
const statusesFor=sus=>sus==='G'?STATUSES_G:NOFLUSH.includes(sus)?STATUSES_AG:STATUSES_PF;
const grp=c=>c.group||'';
function sortCepas(st=state){const r=c=>grp(c)?st.groups.indexOf(c.group):-1;st.cepas.sort((a,b)=>r(a)-r(b));} // stable: ungrouped first, then by group order
const cepaRank=code=>{const i=state.cepas.findIndex(c=>c.code===code);return i<0?9999:i;};   // order set in the Strains tab
const cname=code=>(state.cepas.find(c=>c.code===code)||{}).name||code;                    // strain display name
const pick=(arr,conds)=>arr.filter(p=>conds.every(([k,v])=>v==='ALL'||p[k]===v));          // apply the active filters
const has=(q,...vals)=>!q||vals.some(v=>String(v||'').toLowerCase().includes(q));          // search match
const opts=(list,sel)=>list.map(o=>`<option value="${o.v}"${o.v===sel?' selected':''}>${o.l}</option>`).join('');
const cepaOptions=sel=>{ // strains as <option>s, grouped in <optgroup>s
  const opt=c=>`<option value="${esc(c.code)}"${c.code===sel?' selected':''}>${esc(c.code)} — ${esc(c.name)}</option>`;
  const of=g=>state.cepas.filter(c=>grp(c)===g).map(opt).join('');
  return of('')+state.groups.map(g=>of(g)&&`<optgroup label="${esc(g)}">${of(g)}</optgroup>`).join('');
};
// markup helpers (the same few blocks were repeated dozens of times)
const fld=(label,inner)=>`<div class="fg"><label class="fl">${label}</label>${inner}</div>`;
const ibox=(label,val)=>`<div class="ibox"><div class="ilabel">${label}</div><div class="ivalue">${val}</div></div>`;
const dim=t=>`<span style="font-size:calc(15px*var(--fz,1));color:var(--dim)">${t}</span>`;
const sub=(title,right='',top=true)=>`<div class="subsec-head"${top?' style="margin-top:14px"':''}><span class="subsec-title">${title}</span>${right}</div>`;
const formBox=(inner,actions)=>`<div class="form-box">${inner}<div class="brow">${actions}</div></div>`;
const notebox=(ta,p,k)=>`<div class="notebox"><div class="notebox-label">NOTES</div><textarea id="${ta}" onblur="setF('${p.id}','${k}','notes',this.value)">${esc(p.notes||'')}</textarea></div>`;
const statusRow=(p,list,k='c')=>`<div style="margin-bottom:12px"><div class="fl" style="margin-bottom:6px;letter-spacing:1px">STATUS</div><div class="status-row">${list.map(s=>`<button class="sbtn${p.status===s?' cur':''}" data-s="${s}" onclick="setStatus('${p.id}','${s}','${k}')">${sl(s)}</button>`).join('')}</div></div>`;
function setF(id,k,field,v){const p=owner(k).get(id);if(p){p[field]=v;save();}}   // generic field setter (notes, storage, criteria…)
function showGrid(grid,count,items,total,empty,card){$(count).textContent=items.length+' / '+total;$(grid).innerHTML=items.length?items.map(card).join(''):empty;}

function normalize(s){
  const okId=id=>typeof id==='string'&&/^[\w-]+$/.test(id);
  s.prints=s.prints||[];
  s.pasteles.forEach(p=>{
    p.flushes=p.flushes||[];
    if(!Array.isArray(p.history)||!p.history.length)p.history=[{status:initialStatus(p.substrate),date:p.dateIn||null}];
    if(p.history[p.history.length-1].status!==p.status)p.history.push({status:p.status,date:null}); // earlier change with no recorded date
  });
  s.prints.forEach(p=>{p.originCode=p.originCode||'';p.type=SPORE_NAME[p.type]?p.type:'PR';if(!Array.isArray(p.photos))p.photos=p.photo?[{data:p.photo,date:p.date||''}]:[];delete p.photo;});
  recs(s).forEach(p=>{if(!okId(p.id))p.id=uid();p.photos=(Array.isArray(p.photos)?p.photos:[]).filter(x=>x&&typeof x==='object'&&(x.data||x.id));});
  s.groups=[...new Set((Array.isArray(s.groups)?s.groups:[]).map(g=>String(g).trim()).filter(Boolean))];
  s.cepas.forEach(c=>{c.group=String(c.group||'').trim();if(c.group&&!s.groups.includes(c.group))s.groups.push(c.group);});
  sortCepas(s);
  s.schemaVersion=Math.max(s.schemaVersion||1,SCHEMA);
  return s;
}

// ── SUMMARY ──
function renderResumen(){
  const ps=state.pasteles,ym=today().slice(0,7);
  const fl=ps.flatMap(p=>(p.flushes||[]).map((f,i)=>({date:f.date,yield:parseFloat(f.yield)||0,pcode:p.code,pid:p.id,fnum:i+1,strain:cname(p.strain)})).filter(f=>f.date))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const sum=a=>a.reduce((s,f)=>s+f.yield,0);
  const stat=(l,v,st='')=>`<div class="sum-stat"><span class="sum-stat-label">${l}</span><span class="sum-stat-val"${st}>${v}</span></div>`;
  const boxes=['COLONIZANDO','COLONIZADO','PRIMORDIANDO','FRUCTIFICANDO','DESCANSANDO','ACTIVO','CONTAMINADO'].map(s=>[s,ps.filter(p=>p.status===s).length]).filter(b=>b[1]>0);
  $('resumen-content').innerHTML=`
    <div class="sum-grid" style="margin-bottom:12px">${boxes.map(([s,c])=>`
      <div class="sum-box" style="cursor:pointer" role="button" tabindex="0" onclick="setFilter('status','${s}');go('cultivos')">
        <div class="sum-val">${c}</div><div class="sum-label"><span class="badge s-${s}">${sl(s)}</span></div>
      </div>`).join('')}</div>
    <div class="sum-stats">${stat('ACTIVE',ps.filter(p=>!ENDED.includes(p.status)).length)}${stat('SELECTED',ps.filter(p=>p.selected).length+' ★',' style="color:var(--selt)"')}${stat('SPORES',state.prints.length)}${stat('YIELD/MO',sum(fl.filter(f=>f.date.startsWith(ym))).toFixed(0)+'g')}${stat('YIELD TOTAL',sum(fl).toFixed(0)+'g')}${stat('TOTAL CULT',ps.length)}</div>
    ${fl.length?`<div class="sh" style="margin-bottom:8px"><span class="sh-title">LATEST HARVESTS</span></div>${fl.slice(0,6).map(f=>`
      <div class="recent-item" role="button" tabindex="0" onclick="openPastel('${f.pid}')">

        <div style="font-size:calc(20px*var(--fz,1));color:var(--txt)">${f.yield.toFixed(1)}g</div>
      </div>`).join('')}`:''}`;

// ── FILTERS & LISTS ──
const bf=(t,v,l,title)=>`<button class="fb${filters[t]===v?' on':''}"${title?` title="${esc(title)}"`:''} onclick="setFilter(${js(t)},${js(v)})">${esc(l)}</button>`;
function setFilter(t,v){filters[t]=v;(t==='prCepa'||t==='prType')?renderPrints():renderList();}
// One filter bar: groups = [[filterKey, values, labelFn?, titleFn?], …]; a stale (no longer existing) value resets to ALL
function filterBar(elId,groups){
  $(elId).innerHTML=groups.map(([key,vals,label=v=>v,title])=>{
    if(filters[key]!=='ALL'&&!vals.includes(filters[key]))filters[key]='ALL';
    return [bf(key,'ALL','ALL'),...vals.map(v=>bf(key,v,label(v),title&&title(v)))].join('');
  }).join('<span class="fsep">|</span>');
}
const byCepa=ps=>[...new Set(ps.map(p=>p.strain))].sort((a,b)=>cepaRank(a)-cepaRank(b));
function renderFilters(){
  const ps=state.pasteles;
  filterBar('filters',[['cepa',byCepa(ps)],['sus',SUBSTRATES.map(x=>x.v).filter(v=>ps.some(p=>p.substrate===v)),v=>SUS_SHORT[v],v=>SUS_NAME[v]],
    ['status',[...new Set(ps.map(p=>p.status))],x=>sl(x).slice(0,4)]]);
}
function renderPrFilters(){
  const ps=state.prints;
  if(ps.length)filterBar('pr-filters',[['prCepa',byCepa(ps)],['prType',SPORE_TYPES.map(x=>x.v).filter(v=>ps.some(p=>p.type===v)),v=>v,v=>SPORE_NAME[v]]]);
  else $('pr-filters').innerHTML='';
}
// List card shared by cultures, spore records and the "derived cultures" list (meta must already be escaped)
const card=(p,cls,open,meta,{star=false,day=null,sus=null}={})=>`<div class="${cls}" role="button" tabindex="0" onclick="${open}('${p.id}')">
  <div><div class="pcard-top"><span class="pcode">${esc(p.code)}</span><span class="pstrain">${esc(cname(p.strain))}</span>${star?'<span class="sel-star">★</span>':''}${day!==null?`<span class="pdays">day ${day}</span>`:''}</div>
  <div class="pmeta">${meta}</div></div>
  <div class="pright"><div class="badge s-${esc(p.status)}">${esc(sl(p.status))}</div>${sus&&cfg.badges?`<span class="psus">${esc((SUS_NAME[sus]||sus).toUpperCase())}</span>`:''}</div></div>`;
function renderList(){
  renderFilters();
  const q=($('search-input').value||'').toLowerCase(),ord=['COLONIZANDO','COLONIZADO','PRIMORDIANDO','FRUCTIFICANDO','DESCANSANDO','ACTIVO'];
  const rank=p=>{const i=ord.indexOf(p.status);return i<0?99:i;};
  const items=pick(state.pasteles,[['strain',filters.cepa],['substrate',filters.sus],['status',filters.status]]).filter(p=>has(q,p.code,cname(p.strain)))
    .sort((a,b)=>rank(a)-rank(b)||(b.dateIn||'').localeCompare(a.dateIn||''));
  showGrid('pgrid','pcount',items,state.pasteles.length,'<div class="empty">NO CULTURES</div>',p=>{
    const fl=p.flushes||[],fw=fl.reduce((a,f)=>a+(parseFloat(f.yield)||0),0),ph=(p.photos||[]).length;
    return card(p,'pcard','openPastel',`${esc(p.dateIn||'—')}${esc(p.parent?' ◄ '+p.parent:'')}${!noFlush(p)&&fl.length?' · '+fl.length+'F / '+fw.toFixed(1)+'g':''}${ph?' · '+ph+'▣':''}`,{star:p.selected,day:daysSince(p.dateIn),sus:p.substrate});

function renderPrints(){
  renderPrFilters();
  const q=($('pr-search').value||'').toLowerCase();
  const items=pick(state.prints,[['strain',filters.prCepa],['type',filters.prType]]).filter(p=>has(q,p.code,p.originCode,cname(p.strain)))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  showGrid('prgrid','prcount',items,state.prints.length,
    state.prints.length?'<div class="empty">NO MATCHES</div>':'<div class="empty">NO SPORES<br><span style="font-size:calc(16px*var(--fz,1))">USE + NEW → SPORES</span></div>',
    p=>card(p,'prcard','openPrint',`${esc(SPORE_NAME[p.type]||'Print')} ◄ ${esc(p.originCode)} · ${esc(p.date||'—')}${esc(p.storage?' · '+p.storage:'')}`));
}

function openPastel(id){rememberList();currentId=id;confirmingDel=null;expandedFlush=null;editMode=null;showSec('detalle');renderDetail(id);fixScroll('detalle');}
function openPastelByCode(code){const p=state.pasteles.find(p=>p.code===code);if(p)openPastel(p.id);}
function openPrintByCode(code){
  const pr=state.prints.find(p=>p.code===code);
  if(pr)openPrint(pr.id);else alert('Spore record '+code+' not found in the registry');
}
function buildLineage(code,visited=[]){
  if(!code||visited.includes(code))return [];
  const p=state.pasteles.find(p=>p.code===code);
  return !p||!p.parent?[code]:[...buildLineage(p.parent,[...visited,code]),code];
}
const lineageHtml=p=>{
  const chain=buildLineage(p.code);
  return chain.length<2?'':`<div class="lineage">${chain.map((code,i)=>`<span class="lin-item${code===p.code?' current':''}" ${code===p.code?'':'onclick="openPastelByCode('+js(code)+')"'}>${esc(code)}</span>${i<chain.length-1?'<span class="lin-arrow">→</span>':''}`).join('')}</div>`;
};
function infoPanel(p){
  const fl=p.flushes||[],tw=fl.reduce((a,f)=>a+(parseFloat(f.yield)||0),0);
  return `${lineageHtml(p)}
    <div class="info-row">${ibox('INOCULATED',esc(p.dateIn||'—'))}${ibox('SOURCE',esc(p.parent||'—'))}

      ${noFlush(p)?ibox('TYPE',esc((SUS_NAME[p.substrate]||p.substrate).toUpperCase())):ibox('FLUSHES',fl.length)+ibox('TOTAL',tw.toFixed(1)+'g')}</div>

}
const editPanel=p=>`<div class="form-box" style="margin-bottom:12px">
    <div style="font-size:calc(14px*var(--fz,1));color:var(--dim);letter-spacing:1px;margin-bottom:4px">CODE: <span id="e-code" style="color:var(--gld)">${esc(p.code)}</span> <span id="e-codenote" style="color:var(--dim)"></span></div>
    <div class="frow">${fld('STRAIN',`<select id="e-cepa" onchange="editPreview('${p.id}')">${cepaOptions(p.strain)}</select>`)}${fld('SUBSTRATE',`<select id="e-sus" onchange="editPreview('${p.id}')">${opts(subsOn(p.substrate),p.substrate)}</select>`)}</div>
    <div class="frow">${fld('GENERATION',`<input type="number" id="e-gen" oninput="editPreview('${p.id}')" min="0" max="99" value="${esc(p.gen)}">`)}${fld('INOCULATION DATE',`<input type="date" id="e-fecha" value="${esc(p.dateIn||'')}">`)}</div>
    <div class="frow">${fld('SOURCE CODE',srcInput('e-ori','c','MR001P1',p.parent||''))}${fld('SOURCE SPORES',srcInput('e-print','s','MRPR001.1',p.fromPrint||''))}</div>
    <div class="brow"><button class="btn btn-a" onclick="saveEdit('${p.id}')">▓ SAVE</button><button class="btn" onclick="cancelEdit()">CANCEL</button></div></div>`;
function flushesHtml(p){
  const id=p.id,fl=p.flushes||[];
  return `${sub('FLUSHES','<button class="btn" onclick="toggleFF()">+ FLUSH</button>')}
    <div class="add-flush" id="aff">
      <div class="frow">${fld('DATE','<input type="date" id="ff-fecha">')}${fld('FRESH WEIGHT (g)','<input type="number" id="ff-yield" step="0.1" min="0" placeholder="0.0">')}</div>
      ${fld('NOTES','<textarea id="ff-notas" rows="2" placeholder="flush observations..."></textarea>')}
      <div class="brow"><button class="btn btn-a" onclick="addFlush('${id}')">SAVE</button><button class="btn" onclick="toggleFF()">CANCEL</button></div>
    </div>
    <div class="flush-list">${fl.length?fl.map((f,i)=>{
      const exp=expandedFlush===i+'_'+id;
      return `<div class="fitem">
        <div class="fitem-head" role="button" tabindex="0" onclick="toggleFlush('${id}',${i})">
          <div class="fnum">#${i+1}</div>
          <div><div class="fyield">${esc(f.yield?f.yield+'g (fresh)':'—')}</div><div class="fdate">${esc(f.date||'—')}</div></div>
          <button class="fdel" onclick="event.stopPropagation();delFlush('${id}',${i})">✕</button>
          <span class="fexp${exp?' open':''}">▼</span>
        </div>
        <div class="fitem-body${exp?' open':''}">
          <div class="fl" style="margin-bottom:4px">FLUSH #${i+1} NOTES</div>
          <textarea id="fn_${i}" rows="3" onblur="saveFlushNote('${id}',${i},this.value)">${esc(f.notes||'')}</textarea>
        </div></div>`;}).join(''):'<div style="color:var(--dim);font-size:calc(16px*var(--fz,1));padding:6px">— no flushes —</div>'}</div>`;
}
function historyHtml(p){
  const id=p.id,h=p.history||[],td=today(),plural=n=>n+(n===1?' day':' days');
  const rows=h.map((e,i)=>{
    const nx=h[i+1],day=e.date&&p.dateIn?dayDiff(p.dateIn,e.date):null;
    let dur='—';
    if(e.date&&nx&&nx.date)dur=plural(dayDiff(e.date,nx.date));
    else if(!nx&&ENDED.includes(e.status))dur='final';
    else if(!nx&&e.date)dur=plural(dayDiff(e.date,td))+' · now';
    const prev=h.slice(0,i).map(x=>x.date).filter(Boolean).pop()||'',next=h.slice(i+1).map(x=>x.date).find(Boolean)||'';
    return `<div class="hrow">
      <span class="badge s-${esc(e.status)}">${esc(sl(e.status))}</span>
      <span class="hday">DAY ${day===null?'—':day}</span>
      ${i===0?`<span class="hdate-fixed">${esc(e.date||'—')}</span>`:`<input type="date" class="hdate" value="${esc(e.date||'')}" min="${esc(prev)}" max="${esc(next&&next<td?next:td)}" onchange="setHistDate('${id}',${i},this.value)">`}
      <span class="hdur">${dur}</span>
      ${i===0?'<span class="hx"></span>':`<button class="fdel" title="Remove this entry" onclick="delHist('${id}',${i})">✕</button>`}
    </div>`;
  }).join('');
  return `${sub('STATUS HISTORY',dim(h.length+' '+(h.length===1?'entry':'entries')))}
    ${h.some(e=>!e.date)?'<div class="hnote">— = date not recorded. Set it to complete the timeline.</div>':''}<div>${rows}</div>`;
}
function renderDetail(id){
  const p=getP(id);if(!p)return;
  const d=daysSince(p.dateIn),editing=editMode===id;
  $('dcontent').innerHTML=`
    <div class="dhead"><div><div class="dcode">${esc(p.code)}</div><div class="dstrain">${esc(cname(p.strain))}</div>
      <div class="dsub">${esc(SUBSTRATES.find(s=>s.v===p.substrate)?.l.split('—')[0]||p.substrate)} · GEN ${esc(p.gen)}${d!==null?' · day '+d:''}</div></div>
      <div style="display:flex;gap:4px">${editing?'':`<button class="btn" onclick="startEdit('${id}')">EDIT</button>`}${delUI('c',id)}</div></div>
    ${editing?editPanel(p):infoPanel(p)}
    ${statusRow(p,statusesFor(p.substrate))}
    ${notebox('nta',p,'c')}
    ${photoSection(p,'c')}
    ${noFlush(p)?'':flushesHtml(p)}
    ${historyHtml(p)}`;
  hydratePhotos($('dcontent'));
  if(!noFlush(p))$('ff-fecha').value=today();
  if(editing){checkSrc('e-ori','c');checkSrc('e-print','s');}
}
function startEdit(id){editMode=id;renderDetail(id);}
function cancelEdit(){editMode=null;renderDetail(currentId);}
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function recode(p,strain,sus,gen){ // code = strain+number+type+gen; the number is kept unless the strain changes (then renumbered); a clash keeps the old code
  const m=new RegExp('^'+reEsc(p.strain)+'(\\d+)').exec(p.code);
  const code=strain+pad(p.strain===strain&&m?+m[1]:nextNum(strain,state.pasteles))+sus+gen;
  return state.pasteles.some(x=>x!==p&&x.code===code)?p.code:code;
}
function editPreview(id){
  const p=getP(id);if(!p||!$('e-code'))return;
  const c=recode(p,$('e-cepa').value,$('e-sus').value,toGen($('e-gen').value,p.gen));
  $('e-code').textContent=c;$('e-codenote').textContent=c!==p.code?'(was '+p.code+' · relabel)':'';
}
function saveEdit(id){
  const p=getP(id);if(!p)return;
  const old=p.code,code=recode(p,$('e-cepa').value,$('e-sus').value,toGen($('e-gen').value,p.gen));
  p.strain=$('e-cepa').value;p.substrate=$('e-sus').value;p.gen=toGen($('e-gen').value,p.gen);p.dateIn=$('e-fecha').value;
  if(code!==old){p.code=code;state.pasteles.forEach(x=>{if(x.parent===old)x.parent=code;});state.prints.forEach(x=>{if(x.originCode===old)x.originCode=code;});} // the code is the link between records
  if(p.history&&p.history[0])p.history[0].date=p.dateIn||null;
  if(!statusesFor(p.substrate).includes(p.status)){p.status=initialStatus(p.substrate);(p.history=p.history||[]).push({status:p.status,date:today()});}
  p.parent=$('e-ori').value.trim()||null;p.fromPrint=$('e-print').value.trim()||null;
  editMode=null;save();renderDetail(id);
}
function toggleSel(id){const p=getP(id);if(p){p.selected=!p.selected;save();renderDetail(id);}}
function setStatus(id,s,k='c'){ // k: 'c' culture (keeps a status history) · 's' spore record
  const o=owner(k),p=o.get(id);if(!p||p.status===s)return;
  p.status=s;if(k==='c')(p.history=p.history||[]).push({status:s,date:today()});
  save();o.render(id);
}
function setHistDate(id,i,v){
  const p=getP(id);if(!p||!p.history||i<1||!p.history[i])return;
  if(v){

const PHOTO_MAX=512,PHOTO_Q=0.78;
function resizeImg(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(PHOTO_MAX/img.width,PHOTO_MAX/img.height,1),w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',PHOTO_Q));
    };img.onerror=()=>alert('Could not read the image');img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function renderCepas(){

  const row=c=>{
    const counts=`<div class="ccnt">${state.pasteles.filter(p=>p.strain===c.code).length} CULT · ${state.prints.filter(p=>p.strain===c.code).length} SPORES</div>`;
    if(!cepaEdit)return `<div class="citem" data-code="${esc(c.code)}"><div style="min-width:0;flex:1"><div class="ccode">${esc(c.code)}</div><div class="cname">${esc(c.name)}</div></div><div class="cright">${counts}</div></div>`;
    return `<div class="citem edit" data-code="${esc(c.code)}">
      <button class="drag-h" title="Drag to reorder or move to another group (or use ↑ ↓ keys)" aria-label="Reorder ${esc(c.code)}" onkeydown="cepaHandleKey(event,${js(c.code)})"></button>
      <div style="min-width:0;flex:1"><div class="ccode">${esc(c.code)}</div>
        <input type="text" class="cname-in" value="${esc(c.name)}" maxlength="60" aria-label="Name of ${esc(c.code)}" onchange="renameCepa(${js(c.code)},this)" onkeydown="if(event.key==='Enter')this.blur()"></div>
      <div class="cright">${counts}<button class="btn btn-x btn-sm" title="Delete strain" onclick="delCepa(${js(c.code)})">✕</button></div></div>`;
  };
  const head=(g,n)=>!g?`<div class="cgroup" data-group=""><span class="cg-name">UNGROUPED</span><span class="cg-n">${n}</span></div>`
    :!cepaEdit?`<div class="cgroup" data-group="${esc(g)}"><span class="cg-name">${esc(g)}</span><span class="cg-n">${n}</span></div>`
    :`<div class="cgroup edit" data-group="${esc(g)}"><input type="text" class="cg-in" value="${esc(g)}" maxlength="30" aria-label="Group name" onchange="renameGroup(${js(g)},this)" onkeydown="if(event.key==='Enter')this.blur()"><span class="cg-n">${n}</span>
      <button class="btn btn-sm" title="Move group up" onclick="moveGroup(${js(g)},-1)">↑</button><button class="btn btn-sm" title="Move group down" onclick="moveGroup(${js(g)},1)">↓</button>
      <button class="btn btn-x btn-sm" title="Delete group (its strains become ungrouped)" onclick="delGroup(${js(g)})">✕</button></div>`;
  list.innerHTML=['',...state.groups].map(g=>{
    const items=state.cepas.filter(c=>grp(c)===g);
    if(!state.groups.length)return items.map(row).join('');   // no groups: plain list
    if(!g&&!items.length&&!cepaEdit)return '';                  // "ungrouped" header only when needed (always while editing: it is a drop target)
    return head(g,items.length)+items.map(row).join('');
  }).join('');
}
function toggleCepaEdit(){cepaEdit=!cepaEdit;renderCepas();}
function addCepa(){
  const code=$('c-code').value.trim().toUpperCase(),name=$('c-name').value.trim();
  if(!code||!name){alert('Code and name are required');return;}
  if(!/^[A-Z0-9]+$/.test(code)){alert('Code: letters and numbers only');return;}
  if(state.cepas.find(c=>c.code===code)){alert('Code already exists');return;}
  state.cepas.push({code,name,group:$('c-group').value});sortCepas();save();
  $('c-code').value=$('c-name').value=$('c-group').value='';
  renderCepas();
}
function delCepa(code){
  const cnt=state.pasteles.filter(p=>p.strain===code).length;
  if(cnt>0){alert('Delete the cultures of this strain first ('+cnt+')');return;}
  state.cepas=state.cepas.filter(c=>c.code!==code);save();renderCepas();
}
function renameCepa(code,inp){ // name only: the code is embedded in every record (MR013P3) and is never changed
  const c=state.cepas.find(x=>x.code===code);if(!c)return;
  const v=inp.value.trim();
  if(!v){alert('The name cannot be empty');inp.value=c.name;return;}
  inp.value=v;if(v!==c.name){c.name=v;save();}
}
// A strain's group is decided by its position: the nearest group header above it ('' = ungrouped).
// So dragging (or ↑ ↓) both reorders strains and moves them between groups.
const cepaSeq=()=>['',...state.groups].flatMap(g=>[g,...state.cepas.filter(c=>grp(c)===g)]); // headers are strings, strains objects
function applyCepaSeq(seq){
  let g='';const next=[];
  seq.forEach(x=>{if(typeof x==='string')g=x;else{x.group=g;next.push(x);}});
  const before=JSON.stringify(state.cepas);state.cepas=next;
  if(JSON.stringify(next)!==before)save();
}
function moveCepa(code,dir){
  const seq=cepaSeq(),i=seq.findIndex(x=>x.code===code),j=i+dir;
  if(i<0||j<1||j>=seq.length)return;   // seq[0] is the "ungrouped" header: nothing above it
  [seq[i],seq[j]]=[seq[j],seq[i]];applyCepaSeq(seq);renderCepas();
}
function cepaHandleKey(e,code){ // accessibility: with the handle focused, ↑ ↓ move the strain
  if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;
  e.preventDefault();moveCepa(code,e.key==='ArrowUp'?-1:1);
  [...$('cepa-list').children].find(r=>r.dataset.code===code)?.querySelector('.drag-h').focus();
}
const groupTaken=(name,except)=>state.groups.some(g=>g!==except&&g.toLowerCase()===name.toLowerCase());
function addGroup(){
  const inp=$('g-name'),name=inp.value.trim();
  if(!name)return;
  if(groupTaken(name)){alert('That group already exists');return;}
  state.groups.push(name);inp.value='';save();renderCepas();
}
function renameGroup(old,inp){
  const v=inp.value.trim();
  if(!v||v===old){inp.value=old;return;}
  if(groupTaken(v,old)){alert('That group already exists');inp.value=old;return;}
  state.groups=state.groups.map(g=>g===old?v:g);state.cepas.forEach(c=>{if(c.group===old)c.group=v;});save();renderCepas();
}
function moveGroup(name,dir){
  const i=state.groups.indexOf(name),j=i+dir;
  if(i<0||j<0||j>=state.groups.length)return;
  [state.groups[i],state.groups[j]]=[state.groups[j],state.groups[i]];sortCepas();save();renderCepas();
}
function delGroup(name){ // strains are kept: they become ungrouped
  state.groups=state.groups.filter(g=>g!==name);state.cepas.forEach(c=>{if(c.group===name)c.group='';});sortCepas();save();renderCepas();
}
// ── drag & drop (Pointer Events: mouse and touch) ──
let drag=null;
document.addEventListener('pointerdown',e=>{
  const h=cepaEdit&&e.target.closest?.('.drag-h');if(!h)return;
  const row=h.closest('.citem');e.preventDefault();
  drag={row,list:row.parentNode,h,id:e.pointerId,y:e.clientY,grab:e.clientY-row.getBoundingClientRect().top,raf:0};
  try{h.setPointerCapture(e.pointerId);}catch(_){}
  row.classList.add('dragging');document.body.classList.add('no-select');
  drag.raf=requestAnimationFrame(dragTick);
});
document.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id)drag.y=e.clientY;});
function dragTick(){
  if(!drag)return;
  const {row,list,y}=drag,edge=70,vh=window.innerHeight;
  if(y<edge)window.scrollBy(0,-Math.ceil((edge-y)/5));            // auto-scroll near the screen edges
  else if(y>vh-edge)window.scrollBy(0,Math.ceil((y-(vh-edge))/5));
  const next=[...list.children].filter(r=>r!==row).find(r=>{const b=r.getBoundingClientRect();return y<b.top+b.height/2;});
  row.style.transform='';
  if(next){if(row.nextSibling!==next)list.insertBefore(row,next);}else list.appendChild(row);
  row.style.transform=`translateY(${y-drag.grab-row.getBoundingClientRect().top}px)`; // the row follows the finger
  drag.raf=requestAnimationFrame(dragTick);
}
function dragEnd(e){
  if(!drag||e.pointerId!==drag.id)return;
  cancelAnimationFrame(drag.raf);
  const {row,list,h}=drag;drag=null;
  row.style.transform='';row.classList.remove('dragging');document.body.classList.remove('no-select');
  try{h.releasePointerCapture(e.pointerId);}catch(_){}
  const by=new Map(state.cepas.map(c=>[c.code,c]));
  applyCepaSeq([...list.children].map(el=>el.classList.contains('cgroup')?el.dataset.group:by.get(el.dataset.code)).filter(x=>x!==undefined));
  renderCepas();
}

const SUG={'n-ori':{kind:'c',strain:'n-cepa'},'n-print':{kind:'s',strain:'n-cepa'},'e-ori':{kind:'c',strain:'e-cepa',self:true},'e-print':{kind:'s',strain:'e-cepa'},'nf-pr-ori':{kind:'c',strain:'nf-pr-cepa'}};

const srcInput=(id,kind,ph,val='')=>`<div class="sug-wrap"><input type="text" id="${id}" value="${esc(val)}" placeholder="${esc(ph)}" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" oninput="this.value=this.value.toUpperCase();checkSrc('${id}','${kind}');sugOpen('${id}')" onfocus="sugOpen('${id}')" onkeydown="sugKey(event,'${id}')"><div class="sug" id="sug-${id}" role="listbox" hidden></div></div><div class="src-warn" id="w-${id}"></div>`;
function sugItems(id){
  const cfg=SUG[id],inp=$(id);if(!cfg||!inp)return [];
  const strain=$(cfg.strain)?.value,self=cfg.self&&editMode?(getP(editMode)||{}).code:null,q=inp.value.trim().toUpperCase();
  return [...(cfg.kind==='c'?state.pasteles:state.prints)].reverse().filter(p=>p.code!==self).map(p=>{
    const label=cname(p.strain)+' · '+(cfg.kind==='c'?(SUS_NAME[p.substrate]||p.substrate):(SPORE_NAME[p.type]||'Print')+' · Gen '+p.gen)+' · '+sl(p.status);
    const c=String(p.code).toUpperCase(),r=!q?0:c.startsWith(q)?0:c.includes(q)?1:label.toUpperCase().includes(q)?2:-1; // prefix > contains > name/status
    return {code:p.code,label,r,same:p.strain===strain?0:1};
  }).filter(x=>x.r>=0).sort((a,b)=>a.r-b.r||a.same-b.same).slice(0,40); // stable sort: most recent first
}
function sugOpen(id){
  const box=$('sug-'+id),inp=$(id);if(!box||!inp)return;
  if(sugId&&sugId!==id)sugClose();
  const items=sugItems(id);
  if(!items.length){sugClose();return;}
  sugId=id;sugActive=-1;
  box.innerHTML=items.map(x=>`<div class="sug-item" role="option" data-v="${esc(x.code)}"><span class="sug-code">${esc(x.code)}</span><span class="sug-lab">${esc(x.label)}</span></div>`).join('');
  box.hidden=false;inp.setAttribute('aria-expanded','true');
  requestAnimationFrame(()=>{ // keep the list inside the visible area (mainly with the mobile keyboard open)
    const vv=window.visualViewport,r=box.getBoundingClientRect(),bottom=vv?vv.offsetTop+vv.height:window.innerHeight;
    if(r.bottom>bottom-8)window.scrollBy({top:r.bottom-bottom+12,behavior:'smooth'});
  });
}
function sugClose(){
  if(!sugId)return;
  const box=$('sug-'+sugId),inp=$(sugId);
  if(box){box.hidden=true;box.innerHTML='';}
  if(inp)inp.setAttribute('aria-expanded','false');
  sugId=null;sugActive=-1;
}
function sugPick(v){
  const id=sugId,inp=id&&$(id);if(!inp)return;
  inp.value=v;checkSrc(id,SUG[id].kind);sugClose();
  if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)inp.blur(); // close the on-screen keyboard on mobile
}
function sugKey(e,id){
  const box=$('sug-'+id);
  if(e.key==='Escape'||e.key==='Tab'){sugClose();return;}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(sugId!==id||box.hidden){sugOpen(id);return;}
    const its=[...box.children];if(!its.length)return;
    sugActive=(sugActive+(e.key==='ArrowDown'?1:-1)+its.length)%its.length;
    its.forEach((x,i)=>x.classList.toggle('on',i===sugActive));
    its[sugActive].scrollIntoView?.({block:'nearest'});
  }else if(e.key==='Enter'&&sugId===id&&sugActive>=0){e.preventDefault();sugPick(box.children[sugActive].dataset.v);}
}
document.addEventListener('click',e=>{const it=e.target.closest?.('.sug-item');if(it&&sugId)sugPick(it.dataset.v);});
document.addEventListener('pointerdown',e=>{if(sugId&&!e.target.closest?.('.sug-wrap'))sugClose();},true);
function checkSrc(inputId,kind){ // soft warning: the source may be external, but a mistyped code silently breaks the lineage link
  const el=$(inputId),w=$('w-'+inputId);if(!el||!w)return;
  const v=el.value.trim();
  w.textContent=v&&!(kind==='c'?state.pasteles:state.prints).some(x=>x.code===v)?'⚠ not in your records (fine if the source is external)':'';
}

// ── EXPORT / IMPORT ──
async function exportData(){ // built piece by piece so memory peaks stay low with many photos
  const parts=['{"appVersion":'+JSON.stringify(APP_VERSION)+',"settings":'+JSON.stringify(cfg)];
  for(const [k,v] of Object.entries(state)){
    if(k==='appVersion'||k==='settings')continue; // written above from the live values; an imported file can leave stale copies in state
    if(k!=='pasteles'&&k!=='prints'){parts.push(','+JSON.stringify(k)+':'+JSON.stringify(v,null,2));continue;}
    const items=[];
    for(const rec of v){
      const photos=[];
      for(const ph of rec.photos||[]){const data=ph.data||await photoGet(ph.id);if(data)photos.push({data,date:ph.date||''});}
      items.push(JSON.stringify({...rec,photos}));
    }
    parts.push(',"'+k+'":['+items.join(',')+']');
  }
  parts.push('}');
  const url=URL.createObjectURL(new Blob(parts,{type:'application/json'})),a=document.createElement('a');
  a.href=url;a.download='mycolab_'+today()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function handleImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      if(!Array.isArray(parsed.pasteles)||!Array.isArray(parsed.cepas))throw new Error('Invalid format');
      const prints=parsed.prints||[],photos=[...parsed.pasteles,...prints].reduce((a,p)=>a+(Array.isArray(p.photos)?p.photos.length:p.photo?1:0),0);
      pendingImport=parsed;
      $('imp-info').textContent=parsed.pasteles.length+' cultures · '+prints.length+' spores · '+parsed.cepas.length+' strains · '+photos+' photos'+(parsed.settings?' · settings':'')+((parsed.schemaVersion||1)>SCHEMA?' · ⚠ saved by a newer version — update MycoLab':'');
      $('imp-overlay').classList.add('open');
    }catch(err){alert('Import error: '+err.message);}
  };
  reader.readAsText(file);e.target.value='';
}
$('imp-yes').onclick=async()=>{
  if(!pendingImport)return;
  const oldIds=photoIds(state),st=normalize(pendingImport),incoming=pendingImport.settings;pendingImport=null;
  if(incoming&&typeof incoming==='object'){cfg=cfgParse(incoming);cfgSave();applyCfg();}
  recs(st).forEach(p=>{p.photos=p.photos.filter(x=>typeof x.data==='string'&&x.data);}); // only photos that carry their data can be restored
  await adoptPhotos(st,{fresh:true});
  state=st;photoCache.clear();
  await save();
  await Promise.all(oldIds.map(photoDrop)); // pictures of the replaced data; imported ones got fresh ids, so none of these is still referenced
  $('imp-overlay').classList.remove('open');
  go('cultivos');
};
$('imp-no').onclick=()=>{pendingImport=null;$('imp-overlay').classList.remove('open');};

// ── INIT ──
(async()=>{
  navigator.storage?.persist?.();
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')closeLB();
    const t=e.target; // Enter / Space activate clickable elements that are not real buttons
    if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.tagName!=='BUTTON'){e.preventDefault();t.click();}
  });
  await load();
  $('loading').style.display='none';
  go('cultivos');
})();
