<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CSS - Transparencia con propiedades CSS</title>
  <style>
    .transparent-bg {
      background-color: rgba(0, 0, 0, 0.34); /* Negro con 34% de opacidad */
      padding: 10px;
      height: 200px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    td {
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <h1>Transparencia con propiedades CSS</h1>
  
  <p>Esta página utiliza CSS para aplicar un fondo negro con 34% de opacidad.</p>
  
  <table>
    <tr>
      <td width="50%" class="transparent-bg">
        Contenido con fondo negro semitransparente (34% de opacidad)
      </td>
    </tr>
  </table>
</body>
</html>
