<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrusel Manual</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f4;
      margin: 0;
    }

    .slider {
      width: 500px;
      height: 300px;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    /* Ocultar los radios */
    .slider input {
      display: none;
    }

    .slides img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    #slide1:checked ~ .slides .img1,
    #slide2:checked ~ .slides .img2,
    #slide3:checked ~ .slides .img3 {
      opacity: 1;
      z-index: 1;
    }

    .navigation {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 2;
    }

    .navigation label {
      cursor: pointer;
      background: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: bold;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      transition: background 0.3s;
    }

    .navigation label:hover {
      background: #ddd;
    }
  </style>
</head>
<body>

  <div class="slider">
    <input type="radio" name="slide" id="slide1" checked>
    <input type="radio" name="slide" id="slide2">
    <input type="radio" name="slide" id="slide3">

    <div class="slides">
      <img src="content/stand-interior-azul.jpeg" class="img1" alt="Imagen 1">
      <img src="content/stand-exterior-playa.jpeg" class="img2" alt="Imagen 2">
      <img src="img3.jpg" class="img3" alt="Imagen 3">
    </div>

    <div class="navigation">
      <label for="slide1">1</label>
      <label for="slide2">2</label>
      <label for="slide3">3</label>
    </div>
  </div>

</body>
</html>
